# This is a Declarative Automation Bundle definition for projeto_ecommerce.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: projeto_ecommerce
  uuid: 5e4a94fe-9cee-4c23-999d-4b121fb9aaac

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-756aca88-459e.cloud.databricks.com
    variables:
      catalog: projetoecommerce
      schema: silver
  prod:
    mode: production
    workspace:
      host: https://dbc-756aca88-459e.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/daniel.vlima021@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/daniel.vlima021@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: projetoecommerce
      schema: silver
    permissions:
      - user_name: daniel.vlima021@gmail.com
        level: CAN_MANAGE

